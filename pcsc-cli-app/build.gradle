plugins {
    id 'java'
}

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

group = 'net.heretical_camelid.transit_emv_checker.pcsc_cli_app'
version = rootProject.ext.versionName

dependencies {
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/15
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/16
    implementation 'org.apache.commons:commons-compress:1.27.1'

    implementation project(':tec-library')

    // The following dependencies have been made explicit in order to
    // address transitive dependency issues picked up by GitHub dependabot.
    // Issues are:
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/XX
    // for XX in 15, 16
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation "org.apache.commons:commons-lang3:3.18.0"
    implementation "org.apache.commons:commons-collections4:4.5.0"
    implementation "commons-io:commons-io:2.20.0"

    implementation "com.github.devnied.emvnfccard:library:3.0.1"
    implementation "com.github.devnied:bit-lib4j:1.5.2"
    implementation "net.sf.scuba:scuba-smartcards:0.0.20"
    implementation "org.slf4j:slf4j-api:2.0.17"
    implementation "org.slf4j:slf4j-reload4j:2.0.17"
}

test {
    useJUnitPlatform()
}

// Capability to build a 'fat' JAR following:
// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:java_packaging
tasks.register('uberJar', Jar) {
    archiveClassifier = 'uber'
    duplicatesStrategy = 'warn'

    from sourceSets.main.output

    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

