plugins {
    id 'java-library'
    id 'jacoco'
    id 'com.jaredsburrows.license' version '0.9.8'
}


java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}
group = 'net.heretical_camelid.transit_emv_checker.library'
version = rootProject.ext.versionName

dependencies {

    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/15
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/16
    implementation 'org.apache.commons:commons-compress:1.28.0'
    implementation "org.apache.commons:commons-lang3:3.18.0"
    implementation 'org.apache.commons:commons-collections4:4.5.0'
    implementation 'commons-io:commons-io:2.20.0'
    implementation "net.sf.scuba:scuba-smartcards:0.0.20"

    implementation "com.github.devnied.emvnfccard:library:3.0.1"
    implementation "com.github.devnied:bit-lib4j:1.5.2"

    implementation "org.slf4j:slf4j-api:2.0.17"
    testImplementation "org.slf4j:slf4j-reload4j:2.0.17"
    testImplementation 'org.junit.jupiter:junit-jupiter-api:5.13.4'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // The following line ensures that a report is generated
    // listing dependency copyrights and licenses
    implementation 'com.jaredsburrows:gradle-license-plugin:0.9.8'
}

test {
    useJUnitPlatform {
        includeTags "run_with_gradle"
    }
    testLogging {
        events "passed", "skipped", "failed"
    }
    finalizedBy jacocoTestReport
}

jacocoTestReport {
    dependsOn  test
}

// Capability to build a 'fat' JAR following:
// https://docs.gradle.org/current/userguide/building_java_projects.html#sec:java_packaging
tasks.register('uberJar', Jar) {
    archiveClassifier = 'uber'
    duplicatesStrategy = 'include'
    from sourceSets.main.output
    dependsOn configurations.runtimeClasspath
    from {
        configurations.runtimeClasspath.findAll { it.name.endsWith('jar') }.collect { zipTree(it) }
    }
}

licenseReport {
    generateHtmlReport = true
    generateCsvReport = true
    generateJsonReport = false
    generateTextReport = false
    copyHtmlReportToAssets = false
    useVariantSpecificAssetDirs = false
    showVersions = true
}

