plugins {
    id 'com.android.application'
    id 'base'
    // license reporting presently disabled to avoid a dependabot warning
    // id 'com.jaredsburrows.license' version '0.9.8'
}

def kspath = "$System.env.kspath"
def vname_suffix = "dirty"
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("$kspath")
if(keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
    vname_suffix="$System.env.githash"
}

android {
    namespace = 'net.heretical_camelid.transit_emv_checker.android_app'
    compileSdk = 36

    defaultConfig {
        applicationId "net.heretical_camelid.transit_emv_checker.android_app"
        minSdk = 25
        targetSdk = 36

        // Version name and number are managed in the root build.gradle file

        versionCode rootProject.ext.versionCode
        // For builds triggered under build_and_test_everything.sh
        // where the working directory exactly matches git HEAD,
        // the 7-hex-prefix of the current git HEAD hash will
        // be substituted for the $vname_suffix variable
        // in the line below.
        // For other builds, the variable will be the string 'dirty'.
        versionName rootProject.ext.versionName+"-$vname_suffix"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    signingConfigs {
        release {
            if(keystorePropertiesFile.exists()) {
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if(keystorePropertiesFile.exists()) {
                signingConfig signingConfigs.release
            }
        }
        debug {
            enableUnitTestCoverage = true
            enableAndroidTestCoverage = true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
        // desugaring required to use LocalDateTime at minSdk 25
        coreLibraryDesugaringEnabled = true
    }
    buildFeatures {
        viewBinding = true
        buildConfig = true
    }
    lint {
        disable += [ 'DefaultLocale', 'ObsoleteSdkInt', 'VectorPath', 'UnusedResources' ]
    }
    testOptions {
        unitTests {
            includeAndroidResources = true
        }
        managedDevices {
            localDevices {
                defaultGoogleATD /*(com.android.build.api.dsl.ManagedVirtualDevice)*/ {
                    // A lower resolution device is used here for better emulator performance
                    device = "Pixel 6"
                    apiLevel = 34
                    // The 'google' image is required because 'aosp-atd' does not contain
                    // the system file picker
                    systemImageSource = "google"
                    // abi = "x86_64"
                }
            }
        }
    }
    sourceSets {
        main {
            // Bring in the XML capture files used for automated tests
            // TODO: Work out how to include these in debug builds only
            assets.srcDirs += [ '../tec-library/src/main/assets' ]
            // Bring in the library files so we get coverage over them
            //java.srcDirs += [ '../tec-library/src/main/java' ]
        }
    }
}

base {
    archivesName = "TransitEMVChecker-$android.defaultConfig.versionName"
}

dependencies {
    // desugaring required to use LocalDateTime at minSdk 25
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'

    implementation project(':tec-library')



    // Versions for transitive dependencies picked up by GitHub dependabot

    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/8
    implementation 'org.jsoup:jsoup:1.21.1'

    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/11
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/17
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/24
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/25
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/26
    implementation 'io.netty:netty-common:4.1.118.Final'
    implementation 'io.netty:netty-codec-http2:4.1.100.Final'
    implementation 'io.netty:netty-handler:4.1.110.Final'
    implementation 'io.netty:netty-codec-http:4.1.100.Final'
    implementation 'com.google.testing.platform:core:0.0.9-alpha03'

    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/14
    // implementation 'com.jaredsburrows:gradle-license-plugin:0.9.8'

    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/15
    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/16
    implementation 'org.apache.commons:commons-compress:1.27.1'

    // https://github.com/tim-littlefair/transit-emv-checker/security/dependabot/27
    implementation 'com.google.protobuf:protobuf-kotlin:4.31.1'
    implementation 'com.google.protobuf:protobuf-java:4.31.1'

    // Real dependencies start here
    implementation "com.github.devnied.emvnfccard:library:3.0.1"
    implementation "com.github.devnied:bit-lib4j:1.5.2"
    implementation "org.apache.commons:commons-lang3:3.17.0"
    implementation "org.apache.commons:commons-collections4:4.5.0"
    implementation "commons-io:commons-io:2.19.0"
    implementation "net.sf.scuba:scuba-smartcards:0.0.20"

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.lifecycle:lifecycle-livedata-ktx:2.9.1'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.1'
    implementation 'androidx.navigation:navigation-fragment:2.9.1'
    implementation 'androidx.navigation:navigation-ui:2.9.1'


    implementation "org.slf4j:slf4j-simple:2.0.17"

    implementation "androidx.test:core:1.6.1"

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test:rules:1.6.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
    androidTestImplementation 'androidx.test.uiautomator:uiautomator:2.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-accessibility:3.6.1'


    // refs:
    // https://github.com/FasterXML/jackson-dataformat-xml/issues/533
    // https://stackoverflow.com/questions/30968735/using-com-bea-xml-stream-package-on-android
    // Android does not have javax.xml by default, but can
    // bring in a suitable substitute like this:
    implementation 'javax.xml.stream:stax-api:1.0-2'
    implementation 'com.fasterxml:aalto-xml:1.3.3'

}

